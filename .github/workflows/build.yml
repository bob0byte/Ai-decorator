name: Build Geode Mod

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="${{ steps.build.outputs.build-output }}"
          f=$(find "$out" -name '*.geode' | head -1)
          cp "$f" "ai-decorator-${{ matrix.config.name }}.geode"
          gh release upload latest "ai-decorator-${{ matrix.config.name }}.geode" --clobber -R ${{ github.repository }}

      # Re-run the build on failure and surface compiler errors as annotations,
      # so they show up on the run summary page without opening the full log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ -d build ]; then
            cmake --build build --config RelWithDebInfo 2>&1 | grep -iE "error|undefined|unresolved" | head -25 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
          else
            echo "::error::No build directory found; the failure happened before compiling."
          fi

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
